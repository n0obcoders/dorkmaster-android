name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            python3-pip build-essential ccache

      - name: Force system python3 to 3.10
        run: |
          PYBIN=$(which python3.10 2>/dev/null || echo "")
          if [ -z "$PYBIN" ]; then
            sudo add-apt-repository ppa:deadsnakes/ppa -y
            sudo apt-get update -qq
            sudo apt-get install -y python3.10 python3.10-dev python3.10-venv
            PYBIN=/usr/bin/python3.10
          fi
          sudo update-alternatives --install /usr/bin/python3 python3 "$PYBIN" 10
          sudo update-alternatives --set python3 "$PYBIN"
          echo "Active python3: $(python3 --version)"

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" "platforms;android-33" "platform-tools" 2>/dev/null || true

      - name: Patch buildozer SDK path
        run: |
          mkdir -p ~/.buildozer/android/platform/
          ln -sfn $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/tools/bin
          ln -sfn $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                  $ANDROID_HOME/tools/bin/sdkmanager

      - name: Nuke all stale buildozer artifacts
        run: |
          rm -rf ~/.buildozer || true
          rm -rf .buildozer   || true

      - name: Get exact Python version for cache key
        id: pyver
        run: |
          echo "ver=$(python3 -c 'import sys; print(f\"{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}\")')" >> $GITHUB_OUTPUT

      - name: Cache Buildozer (keyed to exact Python + spec)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-py${{ steps.pyver.outputs.ver }}-${{ hashFiles('buildozer.spec') }}

      - name: Install Buildozer
        run: pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DorkMaster-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
